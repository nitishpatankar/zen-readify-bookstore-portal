<div class="container mt-4">

  <div class="search-section p-4 mb-4 rounded shadow-sm bg-white">
    <div class="row g-3">
      <div class="col-md-6">
        <input type="text"
               class="form-control"
               placeholder="Search by title or author"
               [(ngModel)]="searchText" />
      </div>
      <div class="col-md-2">
        <button class="btn btn-success w-100"
                (click)="search()">
          Search
        </button>
      </div>
    </div>

    <div class="mt-3">
      <label class="me-3">
        <input type="radio" name="genre"
               (change)="selectedGenre.set('Fiction')" />
        Fiction
      </label>
      <label class="me-3">
        <input type="radio" name="genre"
               (change)="selectedGenre.set('Non-Fiction')" />
        Non-Fiction
      </label>
      <label>
        <input type="radio" name="genre"
               (change)="selectedGenre.set('')" />
        All
      </label>
    </div>
  </div>

  <div class="row">
    @for (book of books(); track book.id) {
    <div class="col-md-3 mb-4">
      <app-book-card [book]="book"></app-book-card>
    </div>
  }
  </div>

</div>
