<div class="container">

  <h2 class="title">Search Books</h2>

  <!-- 🔎 SEARCH FORM -->
  <form [formGroup]="searchForm" class="search-box">

    <input
      type="text"
      formControlName="query"
      placeholder="Search by title, author..."
      class="search-input"
    />

    <div class="genre-group">
      <label *ngFor="let g of genres">
        <input
          type="radio"
          [value]="g"
          formControlName="genre"
        />
        {{ g }}
      </label>

      <label>
        <input
          type="radio"
          value=""
          formControlName="genre"
        />
        All
      </label>
    </div>

  </form>

  <hr>

  <!-- 📚 BOOK GRID -->
  <div class="grid">
    <app-book-card
      *ngFor="let book of books()"
      [book]="book">
    </app-book-card>
  </div>

  <div *ngIf="books().length === 0" class="no-results">
    No books found.
  </div>

</div>
